[build]
  publish = "public"
  command = ""

# URL pulita come sul server locale: /regalo -> /regalo.html
[[redirects]]
  from = "/regalo"
  to = "/regalo.html"
  status = 200

# Asset con hash nel nome: cache lunga
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/regalo.html"
  [headers.values]
    Cache-Control = "no-cache"
